[package]
name = "bil"
version = "0.7.1"
edition = "2021"
description = "Bounded Invariant Logic (bil): OntoLogic + First-Order Logic + Guarded Command Language + Formal Verification & Data Pipelines"
license = "Apache-2.0"

[[bin]]
name = "bil"
path = "src/main.rs"

[lib]
name = "bil"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
